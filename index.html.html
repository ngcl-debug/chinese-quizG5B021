<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>《自相矛盾》KS2 中文互動練習平台</title>
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 載入繁體中文清晰圓潤字體 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans TC"', '"Microsoft JhengHei"', '"PingFang HK"', 'sans-serif'],
          },
          colors: {
            cream: '#FFFDF7',
            warmYellow: '#FEF3C7',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang HK", sans-serif;
      background-color: #FFFDF7;
      background-image: radial-gradient(#FDE68A 1.2px, transparent 1.2px);
      background-size: 24px 24px;
      -webkit-tap-highlight-color: transparent;
    }
    /* 觸控友善立體按鈕效果 */
    .btn-tactile {
      transition: transform 0.12s ease, box-shadow 0.12s ease, background-color 0.15s ease;
    }
    .btn-tactile:active:not(:disabled) {
      transform: translateY(3px);
    }
    /* 語音朗讀動畫 */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.6); }
      70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(59, 130, 246, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0); }
    }
    .speaking-active {
      animation: pulse-ring 1.2s infinite;
      background-color: #2563EB !important;
      color: #FFFFFF !important;
    }
    /* 自訂捲軸 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #FEF3C7;
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb {
      background: #F59E0B;
      border-radius: 999px;
    }
    /* 密碼錯誤震動提示動畫 */
    @keyframes shake-box {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .animate-shake {
      animation: shake-box 0.36s ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">

  <!-- 頂部導覽列 -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b-2 border-amber-200 shadow-sm">
    <div class="max-w-6xl mx-auto px-3 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-2">
      <!-- 標題與返回首頁 -->
      <button onclick="goHome()" class="flex items-center gap-2.5 text-left group focus:outline-none">
        <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 text-white flex items-center justify-center shadow-md group-hover:scale-105 transition-transform">
          <!-- 矛與盾小圖示 SVG -->
          <svg class="w-7 h-7" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 4C11 7 7 8 7 8V18C7 25.5 18 32 18 32C18 32 29 25.5 29 18V8C29 8 25 7 18 4Z" fill="#FDE68A" stroke="#78350F" stroke-width="2.2" stroke-linejoin="round"/>
            <path d="M8 28L28 8M28 8H22M28 8V14" stroke="#DC2626" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div>
          <span class="inline-block text-xs font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">KS2 中文科單元</span>
          <h1 class="text-lg sm:text-xl font-black text-slate-800 tracking-tight leading-tight">《自相矛盾》互動練習</h1>
        </div>
      </button>

      <!-- 右側功能按鈕列 -->
      <div class="flex items-center gap-2 sm:gap-3">
        <!-- 雲端同步狀態提示 -->
        <span id="dbStatusBadge" class="hidden md:inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="dbStatusText">成績自動記錄中</span>
        </span>

        <!-- 課文及溫習筆記按鈕 -->
        <button onclick="openStudyModal('text')" class="btn-tactile flex items-center gap-1.5 px-3.5 py-2.5 rounded-2xl bg-sky-500 hover:bg-sky-600 text-white font-bold text-sm sm:text-base shadow-sm border-b-4 border-sky-700">
          <span>📖</span>
          <span>課文及溫習筆記</span>
        </button>

        <!-- 老師成績紀錄按鈕（需密碼 534534 驗證） -->
        <button onclick="requestTeacherAccess()" class="btn-tactile flex items-center gap-1.5 px-3.5 py-2.5 rounded-2xl bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-sm sm:text-base shadow-sm border-b-4 border-indigo-800">
          <span>🔒</span>
          <span>老師成績紀錄</span>

      </div>
    </div>

  <!-- 頁尾 -->
  <footer class="bg-white/80 border-t border-amber-200 py-4 text-center text-xs sm:text-sm text-slate-500">
    <p>小學第二學習階段（KS2）中文科互動學習平台 • 課題：《自相矛盾》</p>
  </footer>

  <!-- ==================== 彈出視窗 1：課文及溫習筆記 ==================== -->
  <div id="studyModal" class="fixed inset-0 z-50 hidden bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-2 sm:p-4">
    <div class="bg-white w-full max-w-4xl max-h-[90vh] rounded-3xl shadow-2xl border-4 border-sky-200 flex flex-col overflow-hidden">
      <!-- 彈窗標題列 -->

        <div class="flex items-center gap-2">

          <h2 class="text-xl sm:text-2xl font-black">《自相矛盾》課文與重點溫習角</h2>

    <div id="teacherPasswordCard" class="bg-white w-full max-w-sm rounded-3xl shadow-2xl border-4 border-indigo-200 p-5 sm:p-6 space-y-4">
      <div class="text-center space-y-1">

        <h3 class="text-xl font-black text-slate-800">老師專區身份驗證</h3>

        <button type="button" onclick="appendTeacherDigit('3')" class="btn-tactile py-2.5 rounded-2xl bg-slate-100 hover:bg-indigo-50 active:bg-indigo-100 text-slate-800 font-black text-xl border-b-2 border-slate-300">3</button>
        <button type="button" onclick="appendTeacherDigit('4')" class="btn-tactile py-2.5 rounded-2xl bg-slate-100 hover:bg-indigo-50 active:bg-indigo-100 text-slate-800 font-black text-xl border-b-2 border-slate-300">4</button>

        <button type="button" onclick="appendTeacherDigit('6')" class="btn-tactile py-2.5 rounded-2xl bg-slate-100 hover:bg-indigo-50 active:bg-indigo-100 text-slate-800 font-black text-xl border-b-2 border-slate-300">6</button>
        <button type="button" onclick="appendTeacherDigit('7')" class="btn-tactile py-2.5 rounded-2xl bg-slate-100 hover:bg-indigo-50 active:bg-indigo-100 text-slate-800 font-black text-xl border-b-2 border-slate-300">7</button>
        <button type="button" onclick="appendTeacherDigit('8')" class="btn-tactile py-2.5 rounded-2xl bg-slate-100 hover:bg-indigo-50 active:bg-indigo-100 text-slate-800 font-black text-xl border-b-2 border-slate-300">8</button>

  <div id="localRadicalModal" class="fixed inset-0 z-50 hidden bg-slate-900/65 backdrop-blur-xs flex items-center justify-center p-3 sm:p-4">

  <!-- 浮動 Toast 提示 -->
  <div id="toastNotification" class="fixed bottom-5 right-5 z-50 hidden transform transition-all duration-300 translate-y-4 opacity-0">
    <div class="bg-slate-800 text-white px-5 py-3 rounded-2xl shadow-xl flex items-center gap-2.5 font-bold text-sm sm:text-base border border-slate-700">
      <span id="toastIcon">✅</span>
      <span id="toastText">已儲存分數！</span>
    </div>
  </div>

  <!-- Firebase 模組載入與資料庫整合 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const LOCAL_STORAGE_KEY = 'ks2_zixiangmaodun_records_v1';

    function loadLocalRecords() {
      try {
        const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed : [];
      } catch (e) {
        return [];
      }
    }

    function persistLocalRecords(records) {
      try {
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(records));
      } catch (e) {
        console.warn('localStorage write skipped:', e);
      }
    }

    // 全域成績儲存管理（優先支援 localStorage 永久儲存，並於可用時同步雲端）
    window.cloudStore = {
      db: null,
      auth: null,
      user: null,
      appId: typeof __app_id !== 'undefined' ? __app_id : 'ks2-zixiangmaodun-app',
      isReady: false,
      records: loadLocalRecords() // 啟動時立即載入本機已儲存的歷次成績
    };

    async function initCloudDatabase() {
      try {
        if (typeof __firebase_config === 'undefined' || !__firebase_config) {
          updateDbStatus('本機裝置自動記分中', 'emerald');
          return;
        }

        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.cloudStore.auth = auth;
        window.cloudStore.db = db;

        // 遵循規則 3：先完成身份驗證，再進行資料庫讀取與寫入
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        window.cloudStore.user = auth.currentUser;
        window.cloudStore.isReady = true;
        updateDbStatus('雲端成績庫已連線', 'emerald');

        // 遵循規則 1 & 2：使用嚴格公開路徑 /artifacts/{appId}/public/data/quiz_records，且不使用複合查詢
        const recordsCol = collection(db, 'artifacts', window.cloudStore.appId, 'public', 'data', 'quiz_records');
        onSnapshot(
          recordsCol,
          (snapshot) => {
            const loaded = [];
            snapshot.forEach((docSnap) => {
              loaded.push({ id: docSnap.id, ...docSnap.data() });
            });
            // 在記憶體中依時間新至舊排序
            loaded.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            window.cloudStore.records = loaded;
            persistLocalRecords(loaded);
            // 若目前在首頁、個人主頁或老師頁面，即時更新畫面
            if (typeof window.refreshCurrentView === 'function') {
              window.refreshCurrentView();
            }
          },
          (error) => {
            console.error('Firestore onSnapshot error:', error);
            updateDbStatus('本機裝置自動記分中', 'emerald');
          }
        );
      } catch (err) {
        console.error('Firebase init error:', err);
        updateDbStatus('本機裝置自動記分中', 'emerald');
      }
    }

    function updateDbStatus(text, color) {
      const badge = document.getElementById('dbStatusBadge');
      const label = document.getElementById('dbStatusText');
      if (!badge || !label) return;
      label.textContent = text;
      if (color === 'amber') {
        badge.className = 'hidden md:inline-flex items-center gap-1.5 text-xs font-bold px-2.5 py-1.5 rounded-full bg-amber-50 text-amber-700 border border-amber-200';
      }
    }

    // 儲存成績函式（供主程式呼叫）
    window.saveQuizRecordToCloud = async function(recordObj) {
      // 立即寫入記憶體陣列與 localStorage，確保任何裝置離線或重整頁面皆保留分數
      const tempId = 'mem_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
      const localCopy = { id: tempId, ...recordObj };
      window.cloudStore.records.unshift(localCopy);
      persistLocalRecords(window.cloudStore.records);

      if (window.cloudStore.isReady && window.cloudStore.db && window.cloudStore.user) {
        try {
          const recordsCol = collection(window.cloudStore.db, 'artifacts', window.cloudStore.appId, 'public', 'data', 'quiz_records');
          const docRef = await addDoc(recordsCol, recordObj);
          // 更新暫存 ID 為真實 Firestore ID
          const idx = window.cloudStore.records.findIndex(r => r.id === tempId);
          if (idx !== -1) {
            window.cloudStore.records[idx].id = docRef.id;
            persistLocalRecords(window.cloudStore.records);
          }
        } catch (err) {
          console.error('Failed to save record to Firestore:', err);
        }
      }
    };

    // 清除成績紀錄函式（供老師總覽呼叫）
    window.clearQuizRecordsInCloud = async function(studentFilter = 'ALL') {
      const targetRecords = studentFilter === 'ALL'
        ? [...window.cloudStore.records]
        : window.cloudStore.records.filter(r => r.studentName === studentFilter);

      // 從記憶體與 localStorage 移除
      if (studentFilter === 'ALL') {
        window.cloudStore.records = [];
      } else {
        window.cloudStore.records = window.cloudStore.records.filter(r => r.studentName !== studentFilter);
      }
      persistLocalRecords(window.cloudStore.records);

      if (window.cloudStore.isReady && window.cloudStore.db && window.cloudStore.user) {
        try {
          for (const rec of targetRecords) {
            if (rec.id && !rec.id.startsWith('mem_')) {
              const docRef = doc(window.cloudStore.db, 'artifacts', window.cloudStore.appId, 'public', 'data', 'quiz_records', rec.id);
              await deleteDoc(docRef);
            }
          }
        } catch (err) {
          console.error('Error deleting records from Firestore:', err);
        }
      }
    };

    initCloudDatabase();
  </script>

    // 渲染詞語插畫卡片（支援單張或多張組合顯示）
    function renderVocabIllustrationHTML(vocabKeys, compact = false) {
      const keys = Array.isArray(vocabKeys) ? vocabKeys : [vocabKeys];
      const validItems = keys.map(k => ({ key: k, data: VOCAB_ILLUSTRATIONS[k] })).filter(item => item.data);
      if (validItems.length === 0) return '';

      if (validItems.length === 1) {
        const item = validItems[0];
        return `
          <div class="my-2 p-3 sm:p-4 rounded-2xl bg-amber-50/70 border-2 border-amber-200 flex flex-col sm:flex-row items-center gap-3 sm:gap-4">
            <div class="${compact ? 'w-36 h-24 sm:w-44 sm:h-28' : 'w-44 h-28 sm:w-52 sm:h-32'} shrink-0 rounded-2xl overflow-hidden border-2 border-white shadow-xs bg-white">
              ${item.data.svg}
            </div>
            <div class="text-center sm:text-left space-y-1">
              <span class="inline-block px-2.5 py-0.5 rounded-full bg-amber-200/80 text-amber-900 text-xs font-black">🖼️ 圖像小提示</span>
              <p class="text-sm sm:text-base font-bold text-slate-700 leading-snug">${item.data.caption}</p>
            </div>
          </div>
        `;
      }

      // 多張圖片並列（例如綜合運用題）
      return `
        <div class="my-2 p-3 rounded-2xl bg-amber-50/70 border-2 border-amber-200 space-y-2">
          <div class="text-xs font-black text-amber-900">🖼️ 圖像小提示（對照三個情境）：</div>
          <div class="grid grid-cols-3 gap-2 sm:gap-3">
            ${validItems.map((item, idx) => `
              <div class="bg-white rounded-xl p-1.5 border border-amber-200 flex flex-col items-center text-center shadow-2xs">
                <div class="w-full h-16 sm:h-24 rounded-lg overflow-hidden">
                  ${item.data.svg}
                </div>
                <span class="text-[11px] sm:text-xs font-bold text-slate-600 mt-1 line-clamp-1">圖(${idx + 1}) ${item.data.caption}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function openLocalRadicalAnalyzer(word) {
      const info = RADICAL_ANALYSIS_DATA[word];
      const modal = document.getElementById('localRadicalModal');
      const titleEl = document.getElementById('localRadicalModalTitle');
      const bodyEl = document.getElementById('localRadicalModalBody');
      if (!modal || !bodyEl) return;

      titleEl.textContent = `詞語【${word}】部首與筆畫詳細分析`;

      if (!info) {
        bodyEl.innerHTML = `<p class="text-slate-700 font-bold">暫無「${word}」的詳細資料。</p>`;
        modal.classList.remove('hidden');
        return;
      }

      const readAllText = `詞語，${word}。意思是：${info.wordMeaning}。` +
        info.chars.map(c => `${c.char}字，部首是${c.radical}，總共${c.strokes}。${c.reason}`).join('。');

      bodyEl.innerHTML = `
        <div class="bg-white p-4 rounded-2xl border-2 border-cyan-200 flex flex-wrap items-center justify-between gap-3">
          <div>
            <span class="text-xs font-black px-2.5 py-0.5 rounded-full bg-cyan-100 text-cyan-800">詞語解釋</span>
            <p class="text-base sm:text-lg font-black text-slate-800 mt-1">【${word}】：${info.wordMeaning}</p>
          </div>
          <button
            type="button"
            onclick="speakCantonese(\`${escapeForAttr(readAllText)}\`, this)"
            class="btn-tactile px-4 py-2 rounded-2xl bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold text-sm border-b-2 border-blue-300"
          >
            🔊 粵語朗讀全部分析
          </button>
        </div>

        ${VOCAB_ILLUSTRATIONS[word] ? renderVocabIllustrationHTML(word, true) : ''}

        <div class="space-y-3">
          <div class="text-sm font-black text-slate-700">🔎 逐字拆解部首與筆畫（共 ${info.chars.length} 個字）：</div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${info.chars.map(c => `
              <div class="bg-white p-4 rounded-2xl border-2 border-indigo-100 shadow-2xs space-y-2">
                <div class="flex items-center justify-between gap-2">
                  <div class="w-12 h-12 rounded-2xl bg-amber-100 border-2 border-amber-400 flex items-center justify-center text-2xl font-black text-slate-900">
                    ${c.char}
                  </div>
                  <div class="text-right">
                    <div class="inline-block px-2.5 py-0.5 rounded-full bg-indigo-100 text-indigo-800 font-black text-xs sm:text-sm">
                      部首：${c.radical}
                    </div>
                    <div class="text-xs font-bold text-slate-500 mt-1">總筆畫：${c.strokes}</div>
                  </div>
                </div>
                <p class="text-xs sm:text-sm text-slate-700 leading-relaxed bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                  💡 ${c.reason}
                </p>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      modal.classList.remove('hidden');
    }

    // Fisher-Yates 洗牌演算法：隨機打亂每題選項順序並重新編配 A/B/C 標籤
    function shuffleQuestionOptions(question) {
      const letters = ['A', 'B', 'C', 'D'];
      const optionPairs = question.options.map((optStr, idx) => ({
        cleanText: optStr.replace(/^[A-Z]\.\s*/, ''),
        isCorrect: idx === question.answer
      }));

      for (let i = optionPairs.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [optionPairs[i], optionPairs[j]] = [optionPairs[j], optionPairs[i]];
      }

      const shuffledOptions = optionPairs.map((item, newIdx) => `${letters[newIdx]}. ${item.cleanText}`);
      const newAnswerIndex = optionPairs.findIndex(item => item.isCorrect);

      return {
        ...question,
        options: shuffledOptions,
        answer: newAnswerIndex
      };
    }

    // ==================== 5. 音效與粵語語音朗讀 (Web Audio & Web Speech API) ====================
    function playSoundEffect(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;

        if (type === 'correct') {
          // 輕快雙音提示 (C5 -> E5)
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.1);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.36);
        } else if (type === 'wrong') {
          // 溫和低音提示
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.setValueAtTime(200, now + 0.14);
          gain.gain.setValueAtTime(0.14, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now);
          osc.stop(now + 0.36);
        } else if (type === 'finish') {
          // 完成練習歡呼三音 (C5 -> E5 -> G5 -> C6)
          const freqs = [523.25, 659.25, 783.99, 1046.5];
          freqs.forEach((f, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(f, now + idx * 0.11);
            gain.gain.setValueAtTime(0.14, now + idx * 0.11);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.11 + 0.3);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.11);
            osc.stop(now + idx * 0.11 + 0.32);
          });
        }
      } catch (e) {
        // 忽略瀏覽器音效限制錯誤
      }
    }

    let currentSpeakingBtn = null;

    function speakCantonese(text, btnElement = null) {
      if (!('speechSynthesis' in window)) {
        showToast('此瀏覽器暫不支援語音朗讀功能', '⚠️');
        return;
      }

      window.speechSynthesis.cancel();
      if (currentSpeakingBtn) {
        currentSpeakingBtn.classList.remove('speaking-active');
        currentSpeakingBtn = null;
      }

      // 清理括號內空白讓朗讀更自然
      const cleanText = text.replace(/（\s*）/g, '，甚麼，').replace(/\(\s*\)/g, '，甚麼，');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'zh-HK';
      utterance.rate = 0.92; // 略為放慢語速，適合小學生聆聽

      // 尋找香港粵語語音
      const voices = window.speechSynthesis.getVoices();
      const hkVoice = voices.find(v => v.lang === 'zh-HK' || v.lang === 'yue-Hant-HK')
        || voices.find(v => v.lang.includes('HK'))
        || voices.find(v => v.lang.includes('zh'));
      if (hkVoice) {
        utterance.voice = hkVoice;
      }

      if (btnElement) {
        btnElement.classList.add('speaking-active');
        currentSpeakingBtn = btnElement;
      }

      utterance.onend = () => {
        if (currentSpeakingBtn) {
          currentSpeakingBtn.classList.remove('speaking-active');
          currentSpeakingBtn = null;
        }
      };
      utterance.onerror = () => {
        if (currentSpeakingBtn) {
          currentSpeakingBtn.classList.remove('speaking-active');
          currentSpeakingBtn = null;
        }
      };

      window.speechSynthesis.speak(utterance);
    }

    function formatHKDateTime(ts) {
      const d = new Date(ts);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      const hh = String(d.getHours()).padStart(2, '0');
      const min = String(d.getMinutes()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
    }

      if (input.value.length < 10) {
        input.value += digit;
      }
      if (errorBox) errorBox.classList.add('hidden');
    }

    function backspaceTeacherDigit() {
      const input = document.getElementById('teacherPasswordInput');
      const errorBox = document.getElementById('teacherPasswordError');
      if (!input) return;
      input.value = input.value.slice(0, -1);
      if (errorBox) errorBox.classList.add('hidden');
    }

    function clearTeacherDigit() {
      const input = document.getElementById('teacherPasswordInput');
      const errorBox = document.getElementById('teacherPasswordError');
      if (!input) return;
      input.value = '';
      if (errorBox) errorBox.classList.add('hidden');
    }

    function toggleTeacherPwdVisibility() {
      const input = document.getElementById('teacherPasswordInput');
      if (!input) return;
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function verifyTeacherPassword() {
      const input = document.getElementById('teacherPasswordInput');
      const errorBox = document.getElementById('teacherPasswordError');
      const card = document.getElementById('teacherPasswordCard');
      if (!input) return;

      if (input.value.trim() === TEACHER_PASSWORD) {
        state.isTeacherUnlocked = true;
        closeTeacherPasswordModal();
        showToast('密碼正確，已進入老師成績紀錄', '🔓');
        openTeacherDashboard();
      } else {
        if (errorBox) errorBox.classList.remove('hidden');
        if (card) {
          card.classList.remove('animate-shake');
          void card.offsetWidth;
          card.classList.add('animate-shake');
        }
        input.value = '';
        input.focus();
      }
    }

    function lockAndGoHome() {
      state.isTeacherUnlocked = false;
      showToast('已重新上鎖老師成績紀錄', '🔒');
      goHome();
    }

    function openTeacherDashboard() {
      if (!state.isTeacherUnlocked) {
        requestTeacherAccess();
        return;
      }
      window.speechSynthesis && window.speechSynthesis.cancel();
      state.view = 'TEACHER';
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 選擇學生進入個人學習主頁
    function selectStudent(studentName) {
      const found = STUDENTS.find(s => s.name === studentName);
      if (!found) return;
      window.speechSynthesis && window.speechSynthesis.cancel();
      state.currentStudent = found;
      state.view = 'STUDENT_HUB';

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 開始指定單元練習（固定 10 題，並隨機打亂選項順序）
    function startPractice(unitId) {
      if (!state.currentStudent) {
        goHome();
        return;
      }
      window.speechSynthesis && window.speechSynthesis.cancel();

      let selectedUnit = null;
      let rawQuestions = [];

      if (unitId === 'u6') {
        selectedUnit = MIXED_UNIT_META;
        const allPool = [
          ...PRACTICE_UNITS.flatMap(u => u.questions),
          ...BONUS_POOL_QUESTIONS
        ];
        // Fisher-Yates 隨機抽取 10 題
        const shuffledPool = [...allPool];
        for (let i = shuffledPool.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffledPool[i], shuffledPool[j]] = [shuffledPool[j], shuffledPool[i]];
        }
        rawQuestions = shuffledPool.slice(0, 10);
      } else if (unitId === 'u5') {
        selectedUnit = PRACTICE_UNITS.find(u => u.id === 'u5');
        if (!selectedUnit) return;
        // 從課文詞語部首題庫隨機抽取 10 題
        const shuffledU5 = [...selectedUnit.questions];
        for (let i = shuffledU5.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [shuffledU5[i], shuffledU5[j]] = [shuffledU5[j], shuffledU5[i]];
        }
        rawQuestions = shuffledU5.slice(0, 10);
      } else {
        selectedUnit = PRACTICE_UNITS.find(u => u.id === unitId);
        if (!selectedUnit) return;
        rawQuestions = [...selectedUnit.questions];
      }

      // 每次開始皆隨機洗牌每道題目的選項順序（A/B/C 隨機排列）
      state.activeUnit = selectedUnit;
      state.quizQuestions = rawQuestions.map(q => shuffleQuestionOptions(q));
      state.currentIndex = 0;
      state.userAnswers = [];
      state.selectedOptionTemp = null;
      state.hasAnsweredCurrent = false;
      state.view = 'QUIZ';

      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderApp() {
      const container = document.getElementById('appContainer');
      if (!container) return;

      if (state.view === 'HOME') {
        container.innerHTML = renderHomeView();
      } else if (state.view === 'STUDENT_HUB') {
        container.innerHTML = renderStudentHubView();
      } else if (state.view === 'QUIZ') {
        container.innerHTML = renderQuizView();
      } else if (state.view === 'RESULT') {
        container.innerHTML = renderResultView();
      } else if (state.view === 'TEACHER') {
        container.innerHTML = renderTeacherView();
      }
    }

                    ${state.selectedOptionTemp === q.answer ? '🎉 答對了！做得好！' : '💡 差一點點！看看老師解析：'}

                  <button
                    type="button"
                    onclick="speakCantonese(\`${escapeForAttr(q.explanation)}\`, this)"
                    class="px-3 py-1 rounded-xl bg-white border border-slate-300 text-xs font-bold text-slate-700 hover:bg-sky-50"
                  >
                    🔊 聽解析
                  </button>
                </div>
                <p class="text-slate-700 text-sm sm:text-base leading-relaxed">
                  ${q.explanation}
                </p>
              </div>
            ` : ''}

            <!-- 底部操作按鈕 -->
            <div class="pt-2 flex justify-end">
              ${state.hasAnsweredCurrent ? `
                <button
                  type="button"
                  onclick="goToNextQuestion()"
                  class="btn-tactile w-full sm:w-auto px-8 py-4 rounded-2xl bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-700 hover:to-blue-700 text-white font-black text-lg shadow-md border-b-4 border-indigo-900 flex items-center justify-center gap-2"
                >
                  <span>${state.currentIndex < total - 1 ? '下一題' : '完成練習，查看分數與錯題分析'}</span>
                  <span>➡️</span>
                </button>
              ` : `
                <div class="text-sm font-bold text-slate-400">👆 請點選上方其中一個答案選項</div>
              `}
            </div>

            <!-- 練習五每題最尾部分：免登入即時部首智能分析按鈕 -->
            ${unit.id === 'u5' && q.targetWord ? `
              <div class="pt-4 border-t-2 border-dashed border-cyan-200 flex flex-col sm:flex-row items-center justify-between gap-3 bg-gradient-to-r from-cyan-50 via-sky-50 to-indigo-50 p-4 rounded-2xl">
                <div class="text-center sm:text-left">
                  <div class="text-xs font-black text-cyan-800">🤖 AI 部首小助手（無需登入 Gmail • 點擊即時查看）</div>
                  <div class="text-xs text-slate-600 mt-0.5">想進一步認識「<strong class="text-indigo-700">${q.targetWord}</strong>」每個字的部首、筆畫與字義？按右側按鈕即時分析！</div>

                  type="button"

      `;
    }

    function escapeForAttr(str) {
      return String(str).replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/"/g, '&quot;');
    }

    function handleOptionSelect(optionIdx) {
      if (state.hasAnsweredCurrent) return; // 已鎖定當前題目答案
      const q = state.quizQuestions[state.currentIndex];
      state.selectedOptionTemp = optionIdx;
      state.hasAnsweredCurrent = true;
      state.userAnswers[state.currentIndex] = optionIdx;

      if (optionIdx === q.answer) {
        playSoundEffect('correct');
      } else {
        playSoundEffect('wrong');
      }
      renderApp();
    }

    async function goToNextQuestion() {
      window.speechSynthesis && window.speechSynthesis.cancel();
      if (state.currentIndex < state.quizQuestions.length - 1) {
        state.currentIndex++;
        state.selectedOptionTemp = null;
        state.hasAnsweredCurrent = false;
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        // 完成第 10 題，計算分數並儲存紀錄
        await finishQuizAndSave();
      }
    }

    async function finishQuizAndSave() {
      playSoundEffect('finish');
      const total = state.quizQuestions.length; // 10
      let correctCount = 0;
      const detailedItems = [];
      const wrongQuestions = [];

      state.quizQuestions.forEach((q, idx) => {
        const chosenIdx = state.userAnswers[idx];
        const isCorrect = chosenIdx === q.answer;
        if (isCorrect) correctCount++;

        const item = {
          qNumber: idx + 1,
          category: q.category,
          targetWord: q.targetWord || null,
          question: q.question,
          userAnswerText: chosenIdx !== undefined ? q.options[chosenIdx] : '未作答',
          correctAnswerText: q.options[q.answer],
          isCorrect,
          explanation: q.explanation,
          hasWeatherChart: !!q.hasWeatherChart
        };
        detailedItems.push(item);
        if (!isCorrect) {
          wrongQuestions.push(item);
        }
      });

      const score = correctCount * 10; // 每題 10 分，滿分 100 分
      const now = Date.now();
      const recordObj = {
        studentName: state.currentStudent.name,
        unitId: state.activeUnit.id,
        unitTitle: state.activeUnit.title,
        score,
        correctCount,
        totalQuestions: total,
        timestamp: now,
        dateStr: formatHKDateTime(now),
        wrongQuestions,
        detailedItems
      };

      state.lastResultRecord = recordObj;
      state.resultFilterMode = wrongQuestions.length > 0 ? 'WRONG_ONLY' : 'ALL';
      state.view = 'RESULT';

      // 自動寫入資料庫
      if (typeof window.saveQuizRecordToCloud === 'function') {
        await window.saveQuizRecordToCloud(recordObj);
      }

      showToast(`已自動記錄 ${state.currentStudent.name} 的分數：${score} 分！`, '💾');
      renderApp();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function confirmExitQuiz() {
      showCustomConfirm({
        icon: '🚪',
        title: '確定要退出練習嗎？',
        message: '現在退出的話，本次尚未完成的作答進度將不會記錄分數喔！',
        confirmText: '確定退出',
        cancelText: '繼續作答',
        onConfirm: () => {
          state.view = 'STUDENT_HUB';
          renderApp();
        }
      });
    }

                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 text-sm sm:text-base">
                    ${filteredRecords.map(rec => `
                      <tr class="hover:bg-indigo-50/40 transition">
                        <td class="py-3 px-4 text-xs sm:text-sm text-slate-500 whitespace-nowrap">${rec.dateStr || formatHKDateTime(rec.timestamp)}</td>
                        <td class="py-3 px-4 font-black text-slate-800 whitespace-nowrap">${rec.studentName}</td>
                        <td class="py-3 px-4 font-bold text-slate-700">${rec.unitTitle}</td>
                        <td class="py-3 px-4 font-bold text-slate-600 whitespace-nowrap">${rec.correctCount} / ${rec.totalQuestions || 10} 題</td>
                        <td class="py-3 px-4 whitespace-nowrap">
                          <span class="px-3 py-1 rounded-full font-black text-xs sm:text-sm ${rec.score >= 80 ? 'bg-emerald-100 text-emerald-800' : rec.score >= 60 ? 'bg-amber-100 text-amber-800' : 'bg-rose-100 text-rose-800'}">
                            ${rec.score} 分
                          </span>
                        </td>
                        <td class="py-3 px-4 text-right whitespace-nowrap">
                          <button onclick="viewRecordDetail('${rec.id}')" class="px-3 py-1.5 rounded-xl bg-indigo-100 hover:bg-indigo-200 text-indigo-800 font-bold text-xs sm:text-sm">
                            🔍 錯題詳情 (${rec.wrongQuestions ? rec.wrongQuestions.length : 0}錯)
                          </button>
                        </td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `}
          </div>
        </div>
      `;
    }

    // ==================== 8. 老師匯出 CSV 與清除紀錄功能 ====================
    function exportRecordsToCSV() {
      const allRecords = getAllRecords();
      const filteredRecords = allRecords.filter(r => {
        const matchStu = state.teacherFilterStudent === 'ALL' || r.studentName === state.teacherFilterStudent;
        const matchUnit = state.teacherFilterUnit === 'ALL' || r.unitId === state.teacherFilterUnit;
        return matchStu && matchUnit;
      });

      if (filteredRecords.length === 0) {
        showToast('目前沒有可匯出的成績紀錄', '⚠️');
        return;
      }

      const headers = ['作答日期時間', '學生姓名', '練習單元', '答對題數', '總題數', '得分(滿分100)', '答錯題目編號'];
      const rows = filteredRecords.map(r => {
        const wrongNums = (r.wrongQuestions || []).map(w => `第${w.qNumber}題`).join('、') || '全對';
        return [
          `"${r.dateStr || formatHKDateTime(r.timestamp)}"`,
          `"${r.studentName}"`,
          `"${r.unitTitle}"`,
          r.correctCount,
          r.totalQuestions || 10,
          r.score,
          `"${wrongNums}"`
        ].join(',');
      });

      // 加入 UTF-8 BOM 確保 Excel 開啟繁體中文不亂碼
      const csvContent = '\uFEFF' + [headers.join(','), ...rows].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      const dateTag = new Date().toISOString().slice(0, 10);
      link.download = `自相矛盾_學生成績表_${dateTag}.csv`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);

      showToast('已成功匯出 CSV 成績表！', '📥');
    }

    function promptClearRecords() {
      const targetName = state.teacherFilterStudent === 'ALL' ? '所有學生' : `「${state.teacherFilterStudent}」`;
      showCustomConfirm({
        icon: '🗑️',
        title: `確定要清除${targetName}的成績紀錄嗎？`,
        message: '清除後將無法復原這些作答分數與錯題紀錄。',
        confirmText: '確定清除',
        cancelText: '保留紀錄',
        onConfirm: async () => {
          if (typeof window.clearQuizRecordsInCloud === 'function') {
            await window.clearQuizRecordsInCloud(state.teacherFilterStudent);
          }
          renderApp();
          showToast(`已清除${targetName}的成績紀錄`, '🗑️');
        }
      });
    }

    function viewRecordDetail(recordId) {
      const rec = getAllRecords().find(r => r.id === recordId);
      if (!rec) return;

      document.getElementById('attemptDetailTitle').textContent = `${rec.studentName} • ${rec.unitTitle}（${rec.score} 分）`;
      const body = document.getElementById('attemptDetailBody');

      const wrongs = rec.wrongQuestions || [];
      if (wrongs.length === 0) {
        body.innerHTML = `
          <div class="text-center py-8 bg-emerald-50 rounded-2xl border border-emerald-200">
            <div class="text-4xl mb-2">🏆</div>
            <p class="font-black text-emerald-800 text-lg">本次作答全對（100 分），沒有錯題！</p>
            <p class="text-sm text-emerald-700 mt-1">作答時間：${rec.dateStr}</p>
          </div>
        `;
      } else {
        body.innerHTML = `
          <div class="text-sm font-bold text-slate-600 mb-2">
            作答時間：${rec.dateStr} ｜ 答對 ${rec.correctCount} / 10 題 ｜ 錯題共 ${wrongs.length} 題：
          </div>
          ${wrongs.map(w => `
            <div class="p-4 rounded-2xl bg-rose-50/60 border border-rose-200 space-y-2">
              <div class="font-black text-rose-800 text-sm">第 ${w.qNumber} 題（${w.category}）</div>
              <p class="font-bold text-slate-800">${w.question}</p>
              <div class="text-sm font-bold text-rose-700">❌ 學生作答：${w.userAnswerText}</div>
              <div class="text-sm font-bold text-emerald-700">✅ 正確答案：${w.correctAnswerText}</div>
              <div class="text-xs sm:text-sm bg-white p-2.5 rounded-xl border border-sky-200 text-slate-700">
                <strong class="text-sky-700">💡 解析：</strong>${w.explanation}
              </div>
            </div>
          `).join('')}
        `;
      }

      document.getElementById('attemptDetailModal').classList.remove('hidden');
    }

    function closeAttemptDetailModal() {
      document.getElementById('attemptDetailModal').classList.add('hidden');
    }

    // ==================== 9. 課文及溫習筆記彈窗邏輯 ====================
    function openStudyModal(defaultTab = 'text') {
      document.getElementById('studyModal').classList.remove('hidden');
      switchStudyTab(defaultTab);
    }

    function closeStudyModal() {
      window.speechSynthesis && window.speechSynthesis.cancel();
      document.getElementById('studyModal').classList.add('hidden');
    }

    function switchStudyTab(tabName) {
      // 更新按鈕樣式
      ['text', 'vocab', 'grammar', 'weather'].forEach(t => {
        const btn = document.getElementById(`tabBtn-${t}`);
        if (!btn) return;
        if (t === tabName) {
          btn.className = 'study-tab-btn px-4 py-2.5 rounded-t-2xl font-black text-sm sm:text-base bg-white text-sky-700 border-t-2 border-x-2 border-sky-200 -mb-px';
        } else {
          btn.className = 'study-tab-btn px-4 py-2.5 rounded-t-2xl font-bold text-sm sm:text-base text-slate-600 hover:text-sky-700 hover:bg-white/60';
        }
      });

      const body = document.getElementById('studyModalBody');
      if (tabName === 'text') {
        const plainStory = STUDY_DATA.storyParagraphs.map(p => p.replace(/<[^>]*>/g, '')).join('');
        body.innerHTML = `
          <div class="flex flex-wrap items-center justify-between gap-2 bg-amber-50 p-3.5 rounded-2xl border border-amber-200">
            <span class="font-black text-amber-900">📜 課題：《自相矛盾》課文全文</span>
            <button onclick="speakCantonese(\`${escapeForAttr(plainStory)}\`, this)" class="btn-tactile px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm">
              🔊 粵語朗讀全文
            </button>
          </div>
          <div class="space-y-4 text-base sm:text-lg leading-loose text-slate-800 bg-cream p-5 rounded-2xl border border-amber-200">
            ${STUDY_DATA.storyParagraphs.map(p => `<p class="indent-8">${p}</p>`).join('')}
          </div>
          <div class="bg-indigo-50 p-4 rounded-2xl border border-indigo-200">
            <h4 class="font-black text-indigo-900 mb-1">💡 課文主旨與道理：</h4>
            <p class="text-sm sm:text-base text-indigo-800">小販推銷矛和盾時說的話前後不合理、互相抵觸。成語故事《自相矛盾》帶出：<strong>我們說話或做事不要先後不相應，互相抵觸；言行一致才能得到別人的信任和尊重。</strong></p>
          </div>
        `;
      } else if (tabName === 'vocab') {
        body.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            ${STUDY_DATA.vocabList.map(v => `
              <div class="p-4 rounded-2xl bg-slate-50 border-2 border-slate-200 hover:border-sky-300 transition space-y-2.5 flex flex-col justify-between">
                <div class="space-y-2">
                  <div class="flex items-center justify-between gap-2">
                    <span class="text-lg sm:text-xl font-black text-sky-800">${v.icon} ${v.word}</span>
                    <div class="flex items-center gap-1.5">
                      <button
                        type="button"
                        onclick="openLocalRadicalAnalyzer('${escapeForAttr(v.word)}')"
                        class="px-2.5 py-1 rounded-lg bg-indigo-50 border border-indigo-200 text-xs font-bold text-indigo-700 hover:bg-indigo-100"
                      >
                        🤖 部首分析
                      </button>
                      <button onclick="speakCantonese(\`${escapeForAttr(v.word + '。' + v.meaning)}\`, this)" class="px-2.5 py-1 rounded-lg bg-white border border-slate-300 text-xs font-bold text-slate-700 hover:bg-sky-100">
                        🔊 朗讀
                      </button>
                    </div>
                  </div>
                  ${VOCAB_ILLUSTRATIONS[v.vocabKey] ? `
                    <div class="w-full h-32 rounded-2xl overflow-hidden border-2 border-white shadow-2xs bg-white">
                      ${VOCAB_ILLUSTRATIONS[v.vocabKey].svg}
                    </div>
                  ` : ''}
                  <div class="px-2.5 py-1.5 rounded-xl bg-cyan-50 border border-cyan-200 text-xs sm:text-sm font-bold text-cyan-900">
                    🔎 各字部首：${v.radicals}
                  </div>
                  <p class="text-sm font-bold text-slate-700">解釋：${v.meaning}</p>
                </div>
                <p class="text-xs text-slate-600 bg-white p-2.5 rounded-xl border border-slate-100">例句：${v.example}</p>
              </div>
            `).join('')}
          </div>
        `;
      } else if (tabName === 'grammar') {
        body.innerHTML = `
          <div class="space-y-5">
            <div class="p-5 rounded-2xl bg-emerald-50 border-2 border-emerald-200 space-y-3">
              <h4 class="text-lg sm:text-xl font-black text-emerald-900 flex items-center gap-2">
                <span>🔪</span>
                <span>一、部首「刀（刂）」的字形演變</span>
              </h4>
              <p class="text-sm sm:text-base text-slate-700 leading-relaxed">
                「刀」部的字多跟<strong>利器或利器的用途</strong>有關。
              </p>
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div class="bg-white p-4 rounded-xl border border-emerald-200">
                  <div class="font-black text-emerald-800 mb-1">1. 寫在字的「右邊」時 → 寫成「刂」</div>
                  <p class="text-sm text-slate-600">例子：<strong>刺</strong>、<strong>別</strong>、<strong>削</strong>（肖 + 刂）、<strong>利</strong>（禾 + 刂）</p>
                </div>
                <div class="bg-white p-4 rounded-xl border border-emerald-200">
                  <div class="font-black text-emerald-800 mb-1">2. 寫在字的「下邊」時 → 保持寫成「刀」</div>
                  <p class="text-sm text-slate-600">例子：<strong>分</strong>（八 + 刀）、<strong>剪</strong>（前 + 刀）</p>
                </div>
              </div>
            </div>

            <div class="p-5 rounded-2xl bg-amber-50 border-2 border-amber-200 space-y-3">
              <h4 class="text-lg sm:text-xl font-black text-amber-900 flex items-center gap-2">
                <span>🔁</span>
                <span>二、重疊的動詞（動詞 + 一 + 動詞）</span>
              </h4>
              <p class="text-sm sm:text-base text-slate-700 leading-relaxed">
                課文例子：「就是不買也來<strong>看一看</strong>。」<br/>
                在重疊動詞之間加「一」，表示<strong>做動作的時間比較短暫，而且有嘗試一下的意思</strong>。
              </p>
              <div class="bg-white p-4 rounded-xl border border-amber-200 text-sm text-slate-700 space-y-1.5">
                <div>• 哥哥的手<strong>碰一碰</strong>水杯，便把水杯打翻了。</div>
                <div>• 用乾毛巾<strong>抹一抹</strong>桌子，再用清水<strong>洗一洗</strong>毛巾。</div>
                <div>• 進入別人房間前，應先<strong>敲一敲</strong>門。</div>
                <div>• 疲累時<strong>做一做</strong>體操；美味的蛋糕也來<strong>嚐一嚐</strong>；用舊報紙<strong>擦一擦</strong>玻璃窗。</div>
              </div>
            </div>
          </div>
        `;
      } else if (tabName === 'weather') {
        body.innerHTML = `
          <div class="space-y-4">
            <div class="bg-sky-50 p-4 rounded-2xl border border-sky-200 text-sm sm:text-base text-sky-950">
              <strong>🌤️ 實用閱讀重點：</strong>天氣預報資料一般包括四項主要內容：
              <span class="font-bold text-sky-700">① 氣溫（最低 | 最高 °C）</span>、

              <span class="font-bold text-sky-700">③ 風向和風力</span>、

    // ==================== 10. 啟動應用程式 ====================
    window.onload = function() {
      renderApp();
    };
  </script>
